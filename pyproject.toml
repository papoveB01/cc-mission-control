[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-mission-control"
version = "0.2.2"
description = "Live dashboard for Claude Code sessions: agents, subagents, context usage, and tool calls in real time."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Papove Bombando Mfuana" }]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ccmc-server = "cc_mission_control.__main__:main"

[project.urls]
Homepage = "https://github.com/papoveB01/cc-mission-control"

[tool.hatch.build.targets.wheel]
packages = ["cc_mission_control"]
# The built dashboard is committed but not Python source; ship it explicitly.
artifacts = ["cc_mission_control/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
